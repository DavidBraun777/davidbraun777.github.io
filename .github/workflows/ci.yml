name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests with coverage
        run: npm run test:coverage

      - name: Bind validated coverage to this revision
        run: |
          git rev-parse HEAD > coverage/revision.txt
          sha256sum coverage/lcov.info > coverage/lcov.sha256

      - name: Validate blog slugs
        run: |
          bad=0
          shopt -s nullglob
          for f in src/content/blog/*.mdx; do
            slug=$(basename "$f" .mdx)
            if ! echo "$slug" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'; then
              echo "::error file=$f::Invalid blog slug: $slug (must match ^[a-zA-Z0-9][a-zA-Z0-9_-]*$)"
              bad=1
            fi
          done
          exit $bad

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size-check

      - name: Upload LCOV report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-lcov
          path: |
            coverage/lcov.info
            coverage/revision.txt
            coverage/lcov.sha256
          if-no-files-found: error
          retention-days: 1

  sonar:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download LCOV report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitest-lcov
          path: coverage

      - name: Verify downloaded LCOV report
        run: |
          test -s coverage/lcov.info
          test "$(cat coverage/revision.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check coverage/lcov.sha256
          grep -q '^SF:src/' coverage/lcov.info
          grep -q '^SF:next.config.ts$' coverage/lcov.info
          grep -q '^SF:scripts/check-bundle-size.mjs$' coverage/lcov.info

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify preinstalled Google Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome; then
            echo "::error::Google Chrome is missing. Verify the ubuntu-24.04 runner image includes Chrome Stable."
            exit 1
          fi
          google-chrome --version

      - name: Build
        run: npm run build

      - name: Run E2E smoke tests
        run: npm run e2e
        env:
          DEBUG: pw:browser

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
