name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests with coverage
        run: npm run test:coverage

      - name: Validate LCOV report
        run: |
          node <<'NODE'
          const { existsSync, readFileSync, statSync } = require('node:fs')
          const { isAbsolute, relative, resolve, sep } = require('node:path')

          const reportPath = 'coverage/lcov.info'
          if (!existsSync(reportPath) || statSync(reportPath).size === 0) {
            throw new Error(`${reportPath} is missing or empty`)
          }

          const sourceFiles = readFileSync(reportPath, 'utf8')
            .split(/\r?\n/)
            .filter((line) => line.startsWith('SF:'))
            .map((line) => line.slice(3))

          if (sourceFiles.length === 0) {
            throw new Error(`${reportPath} does not contain any SF records`)
          }

          for (const sourceFile of sourceFiles) {
            if (isAbsolute(sourceFile)) {
              throw new Error(`LCOV source path must be repository-relative: ${sourceFile}`)
            }

            const resolvedSource = resolve(sourceFile)
            const relativeSource = relative(process.cwd(), resolvedSource)
            const sonarPath = relativeSource.split(sep).join('/')

            if (isAbsolute(relativeSource) || relativeSource.startsWith(`..${sep}`)) {
              throw new Error(`LCOV source path escapes the repository: ${sourceFile}`)
            }
            if (!sonarPath.startsWith('src/')) {
              throw new Error(`LCOV source path is outside the analyzed application source: ${sourceFile}`)
            }
            if (!existsSync(resolvedSource) || !statSync(resolvedSource).isFile()) {
              throw new Error(`LCOV source path does not exist: ${sourceFile}`)
            }
          }

          console.log(`Validated ${sourceFiles.length} repository-relative LCOV source paths`)
          NODE

      - name: Validate blog slugs
        run: |
          bad=0
          shopt -s nullglob
          for f in src/content/blog/*.mdx; do
            slug=$(basename "$f" .mdx)
            if ! echo "$slug" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'; then
              echo "::error file=$f::Invalid blog slug: $slug (must match ^[a-zA-Z0-9][a-zA-Z0-9_-]*$)"
              bad=1
            fi
          done
          exit $bad

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size-check

      - name: Upload LCOV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download LCOV report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vitest-lcov
          path: coverage

      - name: Verify downloaded LCOV report
        run: |
          test -s coverage/lcov.info
          grep -q '^SF:src/' coverage/lcov.info

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npm run e2e:install

      - name: Build
        run: npm run build

      - name: Run E2E smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
